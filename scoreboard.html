<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scoreboard | Tech Class Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Exo 2', sans-serif; background: #0a000f; color: #f0e6ff; min-height: 100vh; }

    .topnav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 32px;
      background: rgba(10,0,15,0.88); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(180,79,255,0.3);
    }
    .nav-brand { font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: 900; color: #ff2d78; text-decoration: none; letter-spacing: 3px; text-shadow: 0 0 12px rgba(255,45,120,0.7); }
    .nav-links { display: flex; gap: 6px; }
    .nav-link { text-decoration: none; color: #9080b0; padding: 7px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.5px; transition: color 0.2s, background 0.2s; border: 1px solid transparent; }
    .nav-link:hover { color: #fff; background: rgba(180,79,255,0.15); }
    .nav-link.active { color: #f0c040; background: rgba(240,192,64,0.08); border-color: rgba(240,192,64,0.35); }
    .nav-user { align-items: center; gap: 10px; }
    .nav-user-name { font-size: 0.78rem; color: #9080b0; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .signout-btn { background: none; border: 1px solid rgba(255,45,120,0.4); color: #ff2d78; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-family: 'Exo 2', sans-serif; letter-spacing: 0.5px; transition: background 0.2s; }
    .signout-btn:hover { background: rgba(255,45,120,0.1); }
    @media (max-width: 600px) { .topnav { padding: 12px 16px; } .nav-link { padding: 6px 10px; font-size: 0.75rem; } }

    .banner {
      margin-top: 60px;
      background: linear-gradient(135deg, #0a000f 0%, #1a1000 50%, #0f0800 100%);
      padding: 60px 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
      border-bottom: 2px solid rgba(240,192,64,0.4);
    }
    .banner::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, #f0c040, transparent);
      box-shadow: 0 0 20px #f0c040;
    }
    .banner-icon { font-size: 4rem; margin-bottom: 16px; }
    .banner-title {
      font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 900;
      color: #f0c040; letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(240,192,64,0.7), 0 0 40px rgba(240,192,64,0.3);
    }
    .banner-sub { color: #9080b0; font-size: 1rem; margin-top: 10px; letter-spacing: 2px; }

    .content { max-width: 900px; margin: 0 auto; padding: 60px 20px 80px; }

    .breadcrumb { font-size: 0.8rem; color: #9080b0; margin-bottom: 40px; }
    .breadcrumb a { color: #9080b0; text-decoration: none; }
    .breadcrumb a:hover { color: #f0c040; }

    .game-section { margin-bottom: 56px; }

    .game-header {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(240,192,64,0.2);
    }
    .game-icon { font-size: 2rem; }
    .game-title { font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: 900; color: #f0c040; letter-spacing: 2px; }
    .game-count { margin-left: auto; font-size: 0.78rem; color: #6050a0; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }

    .score-table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
    .score-table th {
      text-align: left; font-family: 'Orbitron', sans-serif; font-size: 0.65rem;
      letter-spacing: 2px; color: #6050a0; padding: 4px 16px 10px;
      text-transform: uppercase;
    }
    .score-table th.right { text-align: right; }
    .score-row td {
      background: rgba(240,192,64,0.04);
      border-top: 1px solid rgba(240,192,64,0.1);
      border-bottom: 1px solid rgba(240,192,64,0.1);
      padding: 14px 16px;
      font-size: 0.9rem;
    }
    .score-row td:first-child { border-left: 1px solid rgba(240,192,64,0.1); border-radius: 10px 0 0 10px; }
    .score-row td:last-child  { border-right: 1px solid rgba(240,192,64,0.1); border-radius: 0 10px 10px 0; text-align: right; }
    .rank-num { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; color: #6050a0; min-width: 28px; display: inline-block; }
    .rank-num.gold   { color: #f0c040; text-shadow: 0 0 8px rgba(240,192,64,0.6); }
    .rank-num.silver { color: #c0c8d0; }
    .rank-num.bronze { color: #c07840; }
    .player-name { font-weight: 700; color: #f0e6ff; }
    .player-period { font-size: 0.78rem; color: #9080b0; margin-top: 2px; }
    .score-val { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 900; color: #f0c040; }
    .streak-val { font-family: 'Orbitron', sans-serif; font-size: 0.95rem; font-weight: 700; color: #ff8a3d; white-space: nowrap; }
    .score-row td.streak-col { text-align: right; }
    .score-meta { font-size: 0.72rem; color: #6050a0; margin-top: 2px; }
    .mode-badge {
      display: inline-block; font-size: 0.65rem; font-family: 'Orbitron', sans-serif;
      letter-spacing: 1px; padding: 2px 8px; border-radius: 12px;
      background: rgba(240,192,64,0.08); border: 1px solid rgba(240,192,64,0.2);
      color: #a09030; text-transform: uppercase; margin-left: 6px;
    }

    .empty-state {
      text-align: center; padding: 48px 20px;
      background: rgba(240,192,64,0.03);
      border: 1px dashed rgba(240,192,64,0.2);
      border-radius: 16px;
      color: #6050a0; font-size: 0.9rem; line-height: 1.8;
    }
    .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }

    .loading-state { text-align: center; padding: 48px; color: #6050a0; }
    .loading-dot { animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity:0.4; } 50% { opacity:1; } }

    .period-filter { display: flex; align-items: center; gap: 8px; margin-bottom: 32px; flex-wrap: wrap; }
    .period-label { font-family: 'Orbitron', sans-serif; font-size: 0.72rem; color: #9080b0; letter-spacing: 2px; }
    .period-btn { background: transparent; border: 1px solid rgba(240,192,64,0.25); border-radius: 20px; padding: 5px 14px; font-size: 0.78rem; font-weight: 600; color: #9080b0; cursor: pointer; font-family: 'Exo 2', sans-serif; transition: all 0.2s; }
    .period-btn:hover { color: #f0c040; border-color: rgba(240,192,64,0.5); }
    .period-btn.active { color: #f0c040; background: rgba(240,192,64,0.1); border-color: #f0c040; }

    /* Teacher edit panel */
    .teacher-panel { background: rgba(240,192,64,0.06); border: 1px solid rgba(240,192,64,0.3); border-radius: 16px; padding: 22px 20px; margin-bottom: 34px; }
    .tp-title { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; color: #f0c040; letter-spacing: 2px; margin-bottom: 16px; }
    .tp-title-mode { font-family: 'Exo 2', sans-serif; font-size: 0.8rem; color: #ff8a3d; margin-left: 10px; letter-spacing: 0; font-weight: 600; }
    .tp-grid { display: grid; grid-template-columns: 1.5fr 0.8fr 1.3fr 0.8fr 1fr; gap: 10px; margin-bottom: 14px; }
    @media (max-width: 640px) { .tp-grid { grid-template-columns: 1fr 1fr; } }
    .teacher-panel input, .teacher-panel select { background: rgba(255,255,255,0.07); border: 1px solid rgba(240,192,64,0.3); border-radius: 8px; padding: 10px 12px; color: #f0e6ff; font-family: 'Exo 2', sans-serif; font-size: 0.9rem; outline: none; width: 100%; }
    .teacher-panel input:focus, .teacher-panel select:focus { border-color: #f0c040; }
    .teacher-panel select option { background: #0f0a1e; color: #f0e6ff; }
    .tp-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .tp-save { background: linear-gradient(135deg,#f0c040,#c89010); border: none; color: #0a000f; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 0.72rem; letter-spacing: 1.5px; padding: 12px 24px; border-radius: 8px; cursor: pointer; transition: box-shadow 0.2s; }
    .tp-save:hover { box-shadow: 0 4px 18px rgba(240,192,64,0.4); }
    .tp-cancel { background: transparent; border: 1px solid rgba(255,80,80,0.4); color: #ff8080; font-family: 'Exo 2', sans-serif; font-size: 0.8rem; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
    .tp-msg { font-size: 0.82rem; font-weight: 600; }
    .tp-msg.ok { color: #40e080; }
    .tp-msg.err { color: #ff7070; }
    .row-edit, .row-del { background: none; border: 1px solid rgba(240,192,64,0.3); border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 0.85rem; margin-left: 4px; font-family: 'Exo 2', sans-serif; }
    .row-edit { color: #f0c040; }
    .row-del { color: #ff6060; border-color: rgba(255,96,96,0.35); }
    .row-edit:hover { background: rgba(240,192,64,0.12); }
    .row-del:hover { background: rgba(255,96,96,0.12); }
    .score-row td.actions-col { white-space: nowrap; text-align: right; }
    body.light-mode .teacher-panel input, body.light-mode .teacher-panel select { background: rgba(255,255,255,0.92); color: #1a0030; }
    body.light-mode .teacher-panel select option { background: #ffffff; color: #1a0030; }

    footer { text-align: center; padding: 30px; color: rgba(144,128,176,0.4); font-size: 0.8rem; border-top: 1px solid rgba(180,79,255,0.1); }

    /* Light mode */
    body.light-mode { background: #f4eeff; color: #1a0030; }
    body.light-mode .topnav { background: rgba(244,238,255,0.95); border-bottom-color: rgba(180,79,255,0.2); }
    body.light-mode .nav-link { color: #5a4a8a; }
    body.light-mode .nav-link:hover { color: #1a0030; background: rgba(180,79,255,0.12); }
    body.light-mode .nav-link.active { color: #7a6000; background: rgba(200,160,0,0.1); border-color: rgba(200,160,0,0.4); }
    body.light-mode .breadcrumb, body.light-mode .breadcrumb a { color: #5a4a8a; }
    body.light-mode .score-row td { background: rgba(255,255,255,0.9); border-color: rgba(200,160,0,0.15); }
    body.light-mode .player-name { color: #1a0030; }
    body.light-mode footer { color: rgba(90,74,130,0.55); background: #f4eeff; }

    .theme-toggle { position:fixed; bottom:24px; right:24px; z-index:200; width:50px; height:50px; border-radius:50%; border:1px solid rgba(180,79,255,0.4); background:rgba(20,0,40,0.85); backdrop-filter:blur(10px); cursor:pointer; font-size:1.4rem; display:flex; align-items:center; justify-content:center; transition:transform 0.2s, box-shadow 0.2s; box-shadow:0 4px 18px rgba(0,0,0,0.4); }
    .theme-toggle:hover { transform:scale(1.12); box-shadow:0 6px 28px rgba(180,79,255,0.5); }
    body.light-mode .theme-toggle { background:rgba(255,255,255,0.92); border-color:rgba(180,79,255,0.25); box-shadow:0 4px 18px rgba(180,79,255,0.15); }
  </style>
</head>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="auth.js"></script>
<script>
  const GAMES = [
    { key: 'inclinometer', label: 'Inclinometer', icon: '📐' },
    { key: 'ruler-game',   label: 'Ruler Reading Game', icon: '📏' }
  ];

  let allScores = [];
  let currentPeriod = 'all';

  function filterPeriod(period, btn) {
    currentPeriod = period;
    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderScoreboard();
  }

  function modeLabel(mode) {
    if (!mode) return '';
    const map = { classic: 'Classic', practice: 'Practice', timed: 'Timed' };
    return map[mode] || mode;
  }

  function diffLabel(diff) {
    if (!diff) return '';
    if (diff === 'easy' || diff === 'medium' || diff === 'hard') return diff;
    const map = { 4: '¼"', 2: '⅛"', 1: '1/16"' };
    return map[diff] || diff;
  }

  function renderScoreboard() {
    const filtered = currentPeriod === 'all'
      ? allScores
      : allScores.filter(s => String(s.period) === currentPeriod);

    const content = document.getElementById('scoreboard-content');
    const html = [];

    GAMES.forEach(game => {
      const rows = filtered
        .filter(s => s.game === game.key)
        .sort((a, b) => (b.score || 0) - (a.score || 0))
        .slice(0, 20);

      html.push(`<div class="game-section">`);
      html.push(`<div class="game-header"><span class="game-icon">${game.icon}</span><span class="game-title">${game.label}</span><span class="game-count">${rows.length} entr${rows.length === 1 ? 'y' : 'ies'}</span></div>`);

      if (rows.length === 0) {
        html.push(`<div class="empty-state"><div class="empty-icon">🎮</div>No scores yet for this game${currentPeriod !== 'all' ? ' in Period ' + currentPeriod : ''}.<br>Play a game and opt in to appear here!</div>`);
      } else {
        const actionsTh = isTeacher ? '<th class="right">Edit</th>' : '';
        html.push(`<table class="score-table"><thead><tr><th>#</th><th>Name</th><th>Period</th><th class="right">Best Streak</th><th class="right">Score</th>${actionsTh}</tr></thead><tbody>`);
        rows.forEach((row, i) => {
          const rank = i + 1;
          let rankClass = '';
          if (rank === 1) rankClass = 'gold';
          else if (rank === 2) rankClass = 'silver';
          else if (rank === 3) rankClass = 'bronze';
          const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '';
          const modePart = row.mode ? `<span class="mode-badge">${modeLabel(row.mode)}</span>` : '';
          const diffPart = row.difficulty ? ` · ${diffLabel(row.difficulty)}` : '';
          const streakPart = (row.streak != null) ? `🔥 ${row.streak}` : '—';
          const actionsTd = isTeacher
            ? `<td class="actions-col"><button class="row-edit" onclick="editEntry('${row.id}')" title="Edit">✎</button><button class="row-del" onclick="deleteEntry('${row.id}')" title="Delete">✕</button></td>`
            : '';
          html.push(`<tr class="score-row"><td><span class="rank-num ${rankClass}">${medal || rank}</span></td><td><div class="player-name">${escHtml(row.name || 'Anonymous')}</div><div class="score-meta">${modePart}${diffPart}</div></td><td><div class="player-period">Period ${escHtml(String(row.period || '—'))}</div></td><td class="streak-col"><span class="streak-val">${streakPart}</span></td><td><div class="score-val">${row.score != null ? row.score : '—'}</div></td>${actionsTd}</tr>`);
        });
        html.push(`</tbody></table>`);
      }
      html.push(`</div>`);
    });

    content.innerHTML = html.join('');
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  const TEACHER_EMAIL = 'ncapellini@hhh.k12.ny.us';
  let isTeacher = false;
  let editingId = null;

  function subscribeScores() {
    firebase.firestore().collection('game-results')
      .where('showOnScoreboard', '==', true)
      .onSnapshot(function(snap) {
        allScores = snap.docs.map(function(doc) {
          var d = doc.data(); d.id = doc.id; return d;
        });
        renderScoreboard();
      }, function(err) {
        document.getElementById('scoreboard-content').innerHTML =
          '<div class="empty-state"><div class="empty-icon">⚠️</div>Could not load scores. Please try refreshing.</div>';
        console.error(err);
      });
  }

  function saveEntry() {
    const name = document.getElementById('tp-name').value.trim();
    const period = document.getElementById('tp-period').value;
    const game = document.getElementById('tp-game').value;
    const scoreRaw = document.getElementById('tp-score').value;
    const streakRaw = document.getElementById('tp-streak').value;
    const msg = document.getElementById('tp-msg');
    if (!name) { msg.textContent = 'Enter a name.'; msg.className = 'tp-msg err'; return; }
    if (scoreRaw === '' || isNaN(Number(scoreRaw))) { msg.textContent = 'Enter a score.'; msg.className = 'tp-msg err'; return; }
    const data = {
      game:             game,
      name:             name,
      period:           period || '—',
      score:            Number(scoreRaw),
      streak:           (streakRaw !== '' && !isNaN(Number(streakRaw))) ? Number(streakRaw) : null,
      showOnScoreboard: true,
      savedAt:          firebase.firestore.FieldValue.serverTimestamp()
    };
    const col = firebase.firestore().collection('game-results');
    const wasEditing = !!editingId;
    let op;
    if (wasEditing) {
      op = col.doc(editingId).update(data);
    } else {
      data.result = 'manual';
      data.userEmail = (firebase.auth().currentUser || {}).email || '';
      op = col.add(data);
    }
    op.then(function() {
      cancelEdit();
      msg.textContent = wasEditing ? 'Saved ✓' : 'Added ✓';
      msg.className = 'tp-msg ok';
    }).catch(function(e) {
      console.error(e);
      msg.textContent = 'Error: ' + e.message;
      msg.className = 'tp-msg err';
    });
  }

  function editEntry(id) {
    const row = allScores.find(function(s) { return s.id === id; });
    if (!row) return;
    editingId = id;
    document.getElementById('tp-name').value   = row.name || '';
    document.getElementById('tp-period').value = (row.period != null) ? String(row.period) : '';
    document.getElementById('tp-game').value   = row.game || 'ruler-game';
    document.getElementById('tp-score').value  = (row.score != null) ? row.score : '';
    document.getElementById('tp-streak').value = (row.streak != null) ? row.streak : '';
    document.getElementById('tp-save').textContent = 'Save Changes';
    document.getElementById('tp-cancel').style.display = '';
    document.getElementById('tp-title-mode').textContent = '— editing ' + (row.name || 'entry');
    const msg = document.getElementById('tp-msg'); msg.textContent = ''; msg.className = 'tp-msg';
    document.getElementById('teacher-panel').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function deleteEntry(id) {
    const row = allScores.find(function(s) { return s.id === id; });
    const who = row ? (row.name || 'this entry') : 'this entry';
    if (!confirm('Remove ' + who + ' from the scoreboard? This cannot be undone.')) return;
    firebase.firestore().collection('game-results').doc(id).delete()
      .catch(function(e) { console.error(e); alert('Delete failed: ' + e.message); });
  }

  function cancelEdit() {
    editingId = null;
    document.getElementById('tp-name').value = '';
    document.getElementById('tp-score').value = '';
    document.getElementById('tp-streak').value = '';
    document.getElementById('tp-save').textContent = 'Add to Scoreboard';
    document.getElementById('tp-cancel').style.display = 'none';
    document.getElementById('tp-title-mode').textContent = '';
  }

  firebase.auth().onAuthStateChanged(function(user) {
    if (!user) return;
    isTeacher = (user.email === TEACHER_EMAIL);
    if (isTeacher) document.getElementById('teacher-panel').style.display = 'block';
    subscribeScores();
  });
</script>
</body>
</html>
